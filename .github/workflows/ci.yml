name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  mcp-container:
    name: MCP container introspection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build MCP container
        run: docker build -t vibedoctor-mcp .

      - name: Verify MCP startup and tool discovery
        shell: bash
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const { version } = require('./package.json');
          const requests = [
            { jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'ci', version: '1' } } },
            { jsonrpc: '2.0', method: 'notifications/initialized' },
            { jsonrpc: '2.0', id: 2, method: 'tools/list' }
          ];
          const result = spawnSync('docker', ['run', '--rm', '-i', 'vibedoctor-mcp'], {
            input: requests.map(JSON.stringify).join('\n') + '\n', encoding: 'utf8', timeout: 30000
          });
          assert.equal(result.status, 0, result.stderr || String(result.error));
          const messages = result.stdout.trim().split('\n').map(JSON.parse);
          assert.deepEqual(messages.map(message => message.id), [1, 2]);
          assert.deepEqual(messages[0].result.serverInfo, { name: 'vibedoctor', version });
          assert.ok(messages[1].result.tools.length > 0);
          assert.ok(messages[1].result.tools.every(tool => tool.name && tool.inputSchema.type === 'object'));
          console.log(`MCP container introspection passed: ${messages[1].result.tools.length} tools, version ${version}`);
          NODE
