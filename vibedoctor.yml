version: 1
profile: app

project:
  type: app
  languages:
    - typescript
    - javascript

paths:
  include:
    - src/**
    - tests/**
    # Note: fixtures/** deliberately excluded from the project's own health scan.
    # They contain intentional "debt" examples used only by integration tests (which use temp copies + their own yml overrides or direct runScan).
    # This keeps the self-scan (ouroboros) focused on real src/ code, improving signal and scores for leftovers/dead_code.
  exclude:
    - node_modules/**
    - dist/**
    - build/**
    - .venv/**
    - coverage/**
    - .next/**
    - vendor/**
    - .agents/**
    - ops/**
    - scripts/**
    - db/**
    - test/**
    - tests/**
    - "**/test/**"
    - "**/tests/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/__tests__/**"
    - fixtures/**

baseline:
  enabled: true
  file: .vibedoctor/baseline.json
  fail_only_on_new_issues: true

score:
  minimum: 80

runtime:
  default_timeout_seconds: 120
  tool_timeouts:
    biome: 180
    semgrep: 300
  required_tools:
    - biome
    - semgrep
  fail_on_incomplete_scan: true
  # A tool that runs out of time is retried over changed files only, and the
  # result is reported as partial coverage rather than lost.
  on_timeout: scoped_retry
  scoped_retry_timeout_seconds: 60
  deferred_tools: []
  verify_tools_before_scan: true

relevance:
  enabled: true
  min_confidence: low
  max_findings_per_tool: 200
  max_findings_total: 1000
  synthetic_file_policy: downgrade
  validate_secrets: true
  per_tool:
    vulture:
      min_confidence: medium
      max_findings: 50
    pyright:
      max_findings: 150
    tsc:
      max_findings: 150

suppressions:
  enabled: true
  file: .vibedoctor/suppressions.yml
  require_expiry: false

checks:
  security:
    enabled: true
    fail_on_secrets: true
    fail_on_new_high_vulnerabilities: true
  correctness:
    enabled: true
    fail_on_type_errors: true
    fail_on_test_failures: true
  deadCode:
    enabled: true
    deleteAutomatically: false
    minConfidenceToReport: medium
  leftovers:
    enabled: true
    scanComments: true
    scanCommentedCode: true
    scanLegacyFallbacks: true
    deleteAutomatically: false
  refactorReadiness:
    enabled: true
    minFileLines: 400
    minComplexity: 12
    requireTestsBeforeRefactor: true
  tests:
    enabled: true
    minCoverage: 60
    minChangedCodeCoverage: 70
  dependencies:
    enabled: true
    failOnMissingDependencies: true
    failOnNewDirectVulnerabilities: true
  privacy:
    enabled: true
    minConfidenceToReport: medium
    maskExamples: true
    maxFileBytes: 1048576
    failOnRegulatedIdentifiers: false
    failOnSensitiveAttributes: false
    ai:
      enabled: false
      apiKeyEnv: VIBEDOCTOR_AI_API_KEY
      baseUrlEnv: VIBEDOCTOR_AI_BASE_URL
      modelEnv: VIBEDOCTOR_AI_MODEL
      includeRawValues: false
    presidio:
      enabled: false
  dpdp:
    enabled: true
    minConfidenceToReport: medium
    maskExamples: true
    # Opt-out scanners (default true in product defaults; explicit for this repo)
    usePresidio: true
    useSemgrep: true
    legalSourceVersion: "2025.2-final-corrigendum"
    contextFile: .vibedoctor/dpdp/context.yml
    evidenceFile: .vibedoctor/dpdp/evidence.yml
    failOnSeverity: []
    failOnViolatedControls: []
    failOnlyOnNew: true
    organization:
      processes_personal_data: unknown
      is_significant_data_fiduciary: unknown
      processes_children_data: unknown
      has_cross_border_transfer: unknown

output:
  terminal: true
  json: .vibedoctor/report.json
  html: .vibedoctor/report.html
  agent: .vibedoctor/agent-plan.md
  privacyReview: .vibedoctor/privacy-review.json
